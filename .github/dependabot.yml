# hangfolio-plumbing: 1
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    allow: [{ dependency-name: "kleur" }]   # spike: kleur stands in for the theme package
    open-pull-requests-limit: 1
    commit-message: { prefix: "Update site theme" }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:   # spike S7, step 2: one PR for both engine refs
      engine:
        patterns: ["hangfolio/spike-engine-aged/*"]
